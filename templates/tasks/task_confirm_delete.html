{% extends "base.html" %} 
{% block title %}Delete task — Taskflow{% endblock %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">MISSION CONTROL</p><h1>Delete task</h1></div>
</section>
<div class="detail-panel glass-panel">
  <p>
    Delete "<strong>{{ task.title }}</strong>"? This action cannot be undone.
  </p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete task</button>
    <a href="{% url 'task_detail' task.pk %}" class="btn btn-quiet">Cancel</a>
  </form>
</div>
{% endblock %}
